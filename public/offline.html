<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Max is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0f0c0a;
        color: #f5eee6;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      img { width: 96px; height: 96px; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; }
      p { margin: 0 auto 24px; max-width: 24rem; color: #a99f95; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        background: #f76500;
        color: #1a0d02;
        font: 700 1rem system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Media Max needs a connection to find recommendations. Check your Wi-Fi or mobile data and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
